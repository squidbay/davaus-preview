<!doctype html>
<!-- Source for og.jpg (1200×630). Render: node tools/og/render.mjs -->
<html><head><meta charset="utf-8"><style>
@font-face{font-family:'Raleway';font-weight:600;src:url('../../assets/fonts/raleway-latin-600-normal.woff2')}
@font-face{font-family:'Archivo';font-weight:800;src:url('../../assets/fonts/archivo-latin-800-normal.woff2')}
@font-face{font-family:'Source Sans 3';font-weight:400;src:url('../../assets/fonts/source-sans-3-latin-400-normal.woff2')}
*{box-sizing:border-box;margin:0}
html,body{width:1200px;height:630px;overflow:hidden}
body{background:#1F3D2B;color:#fff;font-family:'Source Sans 3',sans-serif;display:grid;grid-template-columns:1fr 430px}
.left{padding:72px 0 64px 80px;display:flex;flex-direction:column;justify-content:space-between;border-bottom:10px solid #C8842B}
.mark{font-family:'Raleway';font-weight:600;font-size:96px;letter-spacing:.22em;line-height:1}
.eyebrow{font-family:'Raleway';font-weight:600;font-size:22px;letter-spacing:.16em;text-transform:uppercase;color:#F0C98F;margin-top:26px}
h1{font-family:'Archivo';font-weight:800;font-size:50px;line-height:1.08;max-width:640px;text-wrap:balance}
.foot{font-size:24px;color:rgba(255,255,255,.82)}
.right{background:#F6F4EE;color:#1C1B18;padding:64px 56px;display:flex;flex-direction:column;justify-content:center;gap:0;border-bottom:10px solid #C8842B}
.p{padding:24px 0;border-top:2px solid #D8D3C7}
.p:last-child{border-bottom:2px solid #D8D3C7}
.p strong{display:block;font-family:'Archivo';font-weight:800;font-size:36px;line-height:1.1}
.p span{display:block;font-family:'Raleway';font-weight:600;font-size:17px;letter-spacing:.16em;text-transform:uppercase;color:#1F3D2B;margin-top:8px}
</style></head><body>
<div class="left">
  <div><p class="mark">DAVAUS</p><p class="eyebrow">Agricultural equipment innovation</p></div>
  <h1>Retrofit products for the equipment you already run.</h1>
  <p class="foot">Engineered and built in Hoagland, Indiana</p>
</div>
<div class="right">
  <div class="p"><strong>SeedRIGHT</strong><span>Row-crop planters</span></div>
  <div class="p"><strong>Kernel Keeper</strong><span>Corn heads</span></div>
  <div class="p"><strong>Ride Tamer</strong><span>Zero-turn mowers</span></div>
</div>
</body></html>
